services:
  # 1. Express Backend Web Service
  - type: web
    name: aaccent-crm-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false

  # 2. React Vite Frontend Static Site
  - type: web
    name: aaccent-crm-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: aaccent-crm-backend
          type: web
          property: host
